<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <marker id="sa" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#68E01A"/></marker>
  </defs>
  <rect x="1" y="1" width="898" height="338" rx="12" fill="#0d0d0d" stroke="#1a1a1a"/>
  <text x="24" y="36" fill="#68E01A" font-size="20" font-weight="700">SiK Telemetry: a "dumb pipe" any matching radio can join</text>

  <!-- drone -->
  <rect x="60" y="90" width="180" height="90" rx="8" fill="#111" stroke="#68E01A"/>
  <text x="150" y="122" fill="#f0f0f0" font-size="15" font-weight="700" text-anchor="middle">Drone (air radio)</text>
  <text x="150" y="150" fill="#7a8290" font-size="13" text-anchor="middle">NET ID 25</text>

  <!-- legit GCS -->
  <rect x="660" y="90" width="180" height="90" rx="8" fill="#111" stroke="#68E01A"/>
  <text x="750" y="122" fill="#f0f0f0" font-size="15" font-weight="700" text-anchor="middle">Legit GCS radio</text>
  <text x="750" y="150" fill="#7a8290" font-size="13" text-anchor="middle">NET ID 25</text>

  <!-- link -->
  <line x1="240" y1="135" x2="660" y2="135" stroke="#68E01A" stroke-width="3"/>
  <text x="450" y="122" fill="#68E01A" font-size="13" text-anchor="middle">915 MHz FHSS &#183; MAVLink in the clear</text>

  <!-- attacker -->
  <rect x="360" y="240" width="180" height="80" rx="8" fill="#111" stroke="#60a5fa"/>
  <text x="450" y="270" fill="#93c5fd" font-size="15" font-weight="700" text-anchor="middle">Attacker radio</text>
  <text x="450" y="296" fill="#60a5fa" font-size="13" text-anchor="middle">set to NET ID 25</text>

  <line x1="450" y1="135" x2="450" y2="240" stroke="#60a5fa" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#sa)"/>
  <text x="24" y="70" fill="#7a8290" font-size="13">Match the NET ID (+ air speed) and the radios copy every byte to you too — read telemetry AND inject commands.</text>
</svg>
