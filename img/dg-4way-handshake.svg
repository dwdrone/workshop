<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#68E01A"/></marker>
    <marker id="l" markerWidth="9" markerHeight="9" refX="2" refY="3" orient="auto"><path d="M7,0 L0,3 L7,6 Z" fill="#68E01A"/></marker>
  </defs>
  <rect x="1" y="1" width="898" height="428" rx="12" fill="#0d0d0d" stroke="#1a1a1a"/>
  <text x="24" y="36" fill="#68E01A" font-size="20" font-weight="700">WPA2 4-Way Handshake &#8594; Offline Crack</text>

  <!-- actors -->
  <text x="200" y="72" fill="#f0f0f0" font-size="16" font-weight="700" text-anchor="middle">Client (phone/laptop)</text>
  <text x="620" y="72" fill="#f0f0f0" font-size="16" font-weight="700" text-anchor="middle">Access Point (drone)</text>
  <line x1="200" y1="84" x2="200" y2="300" stroke="#333" stroke-dasharray="4 4"/>
  <line x1="620" y1="84" x2="620" y2="300" stroke="#333" stroke-dasharray="4 4"/>

  <g font-size="13">
    <line x1="205" y1="112" x2="615" y2="112" stroke="#68E01A" stroke-width="2" marker-end="url(#r)"/>
    <text x="410" y="106" fill="#7a8290" text-anchor="middle">Associate</text>

    <line x1="615" y1="150" x2="205" y2="150" stroke="#68E01A" stroke-width="2" marker-end="url(#l)"/>
    <text x="410" y="144" fill="#f0f0f0" text-anchor="middle">M1: ANonce (random)</text>

    <line x1="205" y1="188" x2="615" y2="188" stroke="#68E01A" stroke-width="2" marker-end="url(#r)"/>
    <text x="410" y="182" fill="#f0f0f0" text-anchor="middle">M2: SNonce + MIC</text>

    <line x1="615" y1="226" x2="205" y2="226" stroke="#68E01A" stroke-width="2" marker-end="url(#l)"/>
    <text x="410" y="220" fill="#f0f0f0" text-anchor="middle">M3: GTK + MIC</text>

    <line x1="205" y1="264" x2="615" y2="264" stroke="#68E01A" stroke-width="2" marker-end="url(#r)"/>
    <text x="410" y="258" fill="#7a8290" text-anchor="middle">M4: ACK</text>
  </g>

  <!-- attacker capture -->
  <rect x="330" y="126" width="160" height="80" rx="8" fill="none" stroke="#60a5fa" stroke-dasharray="6 4"/>
  <text x="410" y="300" fill="#60a5fa" font-size="13" text-anchor="middle">Attacker captures M1 + M2 from the air (airodump-ng)</text>

  <!-- offline crack -->
  <rect x="60" y="330" width="780" height="80" rx="8" fill="#111" stroke="#ef4444"/>
  <text x="80" y="360" fill="#f87171" font-size="15" font-weight="700">Offline dictionary attack (no contact with the network):</text>
  <text x="80" y="388" fill="#f0f0f0" font-size="13" font-family="JetBrains Mono, monospace">PMK = PBKDF2(HMAC-SHA1, password, SSID, 4096, 256)  &#8594;  test millions of guesses/sec  &#8594;  weak PSK falls</text>
</svg>
