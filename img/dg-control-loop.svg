<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <marker id="ca" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#68E01A"/></marker>
  </defs>
  <rect x="1" y="1" width="898" height="318" rx="12" fill="#0d0d0d" stroke="#1a1a1a"/>
  <text x="24" y="36" fill="#68E01A" font-size="20" font-weight="700">The Flight-Control Loop (~400&#215;/second)</text>

  <g font-size="15" font-weight="700">
    <rect x="60"  y="120" width="150" height="80" rx="8" fill="#111" stroke="#68E01A"/>
    <text x="135" y="152" fill="#f0f0f0" text-anchor="middle">1. SENSE</text>
    <text x="135" y="174" fill="#7a8290" text-anchor="middle" font-size="12" font-weight="400">IMU / GPS / baro</text>

    <rect x="290" y="120" width="150" height="80" rx="8" fill="#111" stroke="#68E01A"/>
    <text x="365" y="146" fill="#f0f0f0" text-anchor="middle">2. COMPARE</text>
    <text x="365" y="168" fill="#7a8290" text-anchor="middle" font-size="12" font-weight="400">actual vs. target</text>
    <text x="365" y="186" fill="#7a8290" text-anchor="middle" font-size="12" font-weight="400">(PID)</text>

    <rect x="520" y="120" width="150" height="80" rx="8" fill="#111" stroke="#68E01A"/>
    <text x="595" y="152" fill="#f0f0f0" text-anchor="middle">3. CORRECT</text>
    <text x="595" y="174" fill="#7a8290" text-anchor="middle" font-size="12" font-weight="400">motor mix</text>

    <rect x="750" y="120" width="120" height="80" rx="8" fill="#111" stroke="#68E01A"/>
    <text x="810" y="152" fill="#f0f0f0" text-anchor="middle">4. ESC</text>
    <text x="810" y="174" fill="#7a8290" text-anchor="middle" font-size="12" font-weight="400">&#8594; motors</text>
  </g>

  <g stroke="#68E01A" stroke-width="2" marker-end="url(#ca)" fill="none">
    <line x1="210" y1="160" x2="286" y2="160"/>
    <line x1="440" y1="160" x2="516" y2="160"/>
    <line x1="670" y1="160" x2="746" y2="160"/>
  </g>
  <!-- feedback arrow -->
  <path d="M810 200 L810 260 L135 260 L135 204" stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#ca)" stroke-dasharray="6 4"/>
  <text x="472" y="282" fill="#60a5fa" font-size="13" text-anchor="middle">feedback: new motion re-measured by the IMU &#8594; loop repeats</text>
  <text x="24" y="80" fill="#7a8290" font-size="13">A multirotor is naturally unstable — it only stays up because this loop runs hundreds of times a second.</text>
  <text x="24" y="102" fill="#7a8290" font-size="13">Feed the SENSE step false data (spoof the GPS or IMU) and every later step makes the wrong correction.</text>
</svg>
